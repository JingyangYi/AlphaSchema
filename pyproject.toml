[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaschema"
version = "0.1.0"
description = "Schema-guided search for executable quantitative factors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
]

[project.scripts]
alphaschema = "alphaschema.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["alphaschema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
